<style>
  #app-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255, 45, 120, 0.22) 0%, transparent 55%),
      radial-gradient(circle at 75% 85%, rgba(155, 89, 182, 0.22) 0%, transparent 55%),
      #1a1025;
    transition: opacity 0.45s ease, visibility 0.45s ease;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app-splash.splash-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #app-splash .splash-logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app-splash .splash-glow {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 36px;
    background: radial-gradient(circle, rgba(255, 45, 120, 0.55) 0%, rgba(155, 89, 182, 0.3) 60%, transparent 80%);
    filter: blur(14px);
    animation: splash-beat 1.2s ease-in-out infinite;
  }
  #app-splash .splash-logo {
    width: 104px;
    height: 104px;
    border-radius: 28px;
    box-shadow: 0 10px 40px rgba(255, 45, 120, 0.5);
    position: relative;
    z-index: 1;
    animation: splash-beat 1.2s ease-in-out infinite;
  }
  #app-splash .splash-title {
    font-family: "Unbounded", system-ui, sans-serif;
    font-weight: 900;
    font-size: 30px;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 24px rgba(255, 45, 120, 0.45);
    margin: 0;
  }
  #app-splash .splash-sub {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.4px;
    margin: -10px 0 0;
  }
  #app-splash .splash-spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.18);
    border-top-color: #FF2D78;
    animation: splash-spin 0.7s linear infinite;
    margin-top: 6px;
  }
  @keyframes splash-beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.1); }
    28% { transform: scale(1); }
    42% { transform: scale(1.06); }
    56% { transform: scale(1); }
  }
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }
</style>
